<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Widget Local Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      /* obvious non-white background so empty iframe space is easy to spot */
      background: repeating-linear-gradient(
        45deg,
        #1f2937 0 16px,
        #111827 16px 32px
      );
      color: white;
    }
    .note {
      padding: 24px;
      max-width: 760px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="note">
    <h1>Widget Embed Test</h1>
    <p>
      The launcher should sit at the bottom-right. When minimized, you should NOT
      see a large white rectangle.
    </p>
  </div>

  <script>
    (function () {
      var COLLAPSED_PX = 88;
      var EXPANDED_PX = 640;
      var MSG_SOURCE = 'htg-chat-widget';

      var iframe = document.createElement('iframe');
      iframe.id = 'htg-chat-widget-iframe';
      iframe.src = 'http://localhost:3001/chat-widget?agentId=honest-to-goodness-agent';
      iframe.style.position = 'fixed';
      iframe.style.bottom = '20px';
      iframe.style.right = '20px';
      iframe.style.width = '380px';
      iframe.style.height = COLLAPSED_PX + 'px';
      iframe.style.border = '0';
      iframe.style.outline = '2px solid rgba(255,255,255,.35)'; // optional for visibility
      iframe.style.zIndex = '9999';
      iframe.setAttribute('title', 'Honest to Goodness support chat');
      iframe.loading = 'lazy';
      iframe.allow = 'clipboard-write';

      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.source !== MSG_SOURCE || typeof d.heightPx !== 'number') return;
        iframe.style.height = d.heightPx + 'px';
      });

      document.body.appendChild(iframe);
    })();
  </script>
</body>
</html>
