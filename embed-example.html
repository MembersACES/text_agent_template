<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Text Agent Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 300px;
            background: white;
            padding: 24px;
            border-right: 1px solid #e5e5e5;
            overflow-y: auto;
        }
        
        .sidebar h1 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #1a1a1a;
        }
        
        .sidebar p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .content-header {
            background: white;
            padding: 16px 24px;
            border-bottom: 1px solid #e5e5e5;
        }
        
        .content-header h2 {
            font-size: 18px;
            color: #1a1a1a;
        }
        
        .iframe-container {
            flex: 1;
            position: relative;
            background: white;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .embed-options {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e5e5e5;
        }
        
        .embed-options h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1a1a1a;
        }
        
        .embed-options label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .embed-options select {
            width: 100%;
            padding: 8px;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 12px;
        }
        
        code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Embedding Example</h1>
            <p>This page demonstrates how to embed the Text Agent interface in your application.</p>
            
            <div class="embed-options">
                <h3>Embedding Options</h3>
                <label for="embedType">Embed Type:</label>
                <select id="embedType" onchange="updateEmbed()">
                    <option value="full">Full Application</option>
                    <option value="chat">Chat Widget Only</option>
                </select>
                
                <p style="font-size: 12px; color: #666; margin-top: 12px;">
                    <strong>Full Application:</strong> Includes both the prompt editor and chat interface.<br><br>
                    <strong>Chat Widget:</strong> Only the chat interface, perfect for embedding in existing pages.
                </p>
            </div>
        </div>
        
        <div class="content">
            <div class="content-header">
                <h2>Embedded Text Agent</h2>
            </div>
            <div class="iframe-container">
                <iframe 
                    id="embedFrame"
                    src="http://localhost:3000"
                    title="Text Agent"
                    allow="clipboard-read; clipboard-write"
                ></iframe>
            </div>
        </div>
    </div>
    
    <script>
        function updateEmbed() {
            const select = document.getElementById('embedType');
            const iframe = document.getElementById('embedFrame');
            const baseUrl = 'http://localhost:3000';
            
            if (select.value === 'chat') {
                iframe.src = baseUrl + '/chat-widget';
            } else {
                iframe.src = baseUrl;
            }
        }
        
        // Update URL in iframe src to match your deployment
        // Replace 'http://localhost:3000' with your actual domain
    </script>
</body>
</html>
